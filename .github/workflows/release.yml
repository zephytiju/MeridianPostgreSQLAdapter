# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra test --locked
      - run: uv pip check --python .venv/bin/python
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/verify_contracts.py
      - run: uv run pytest tests/unit tests/contract tests/packaging
      - run: uv build
      - run: uv run twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
