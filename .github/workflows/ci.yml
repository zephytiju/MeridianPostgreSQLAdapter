# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv pip check --python .venv/bin/python
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/verify_contracts.py
      - run: uv run pytest tests/unit tests/contract tests/packaging

  postgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pg16-postgis34
            version: 16-postgis-3.4
            image: postgis/postgis@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
          - engine: pg17-postgis35
            version: 17.11-postgis-3.5.7
            image: postgis/postgis@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MERIDIAN_POSTGRESQL_IMAGE: ${{ matrix.image }}
      MERIDIAN_POSTGRESQL_TEST_DSN: postgresql://meridian:meridian@127.0.0.1:5432/meridian
      MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv pip check --python .venv/bin/python
      - run: uv run pytest -m 'not cluster' --cov --cov-report=xml --junitxml=postgresql-tests.xml
      - name: Verify built wheel through the real facade
        run: |
          uv build
          uv venv "$RUNNER_TEMP/evidence-wheel"
          uv pip install --python "$RUNNER_TEMP/evidence-wheel/bin/python" -c conformance/postgresql/requirements.txt dist/*.whl 'meridian-storage-evidence>=1.0.1,<2' 'pytest>=8.3,<9'
          uv pip check --python "$RUNNER_TEMP/evidence-wheel/bin/python"
          "$RUNNER_TEMP/evidence-wheel/bin/python" -c 'import meridian_storage.adapters.postgresql as pg; assert "evidence-wheel" in pg.__file__'
          "$RUNNER_TEMP/evidence-wheel/bin/python" -m pytest tests/integration --junitxml=wheel-integration.xml
          "$RUNNER_TEMP/evidence-wheel/bin/python" -m pytest conformance/postgresql --junitxml=projection-tests.xml
          "$RUNNER_TEMP/evidence-wheel/bin/python" scripts/record_conformance.py --junit wheel-integration.xml --junit projection-tests.xml
      - name: Verify released writer and read-only candidate compatibility
        if: matrix.engine == 'pg16-postgis34'
        run: |
          uv venv "$RUNNER_TEMP/legacy-writer"
          uv pip install --python "$RUNNER_TEMP/legacy-writer/bin/python" 'meridian-storage-postgresql==1.0.0' 'meridian-storage-core==1.0.0' 'meridian-storage-query==1.0.0' 'meridian-storage-semantics==1.0.0' 'pytest>=8.3,<9'
          uv pip check --python "$RUNNER_TEMP/legacy-writer/bin/python"
          "$RUNNER_TEMP/legacy-writer/bin/python" tests/integration/read_compatibility_host.py write read-compatibility-receipt.json
          "$RUNNER_TEMP/evidence-wheel/bin/python" tests/integration/read_compatibility_host.py read read-compatibility-receipt.json
          "$RUNNER_TEMP/legacy-writer/bin/python" tests/integration/read_compatibility_host.py restart-writer read-compatibility-receipt.json
      - name: Verify wheel metadata after database restart
        run: |
          "$RUNNER_TEMP/evidence-wheel/bin/python" scripts/schema_restart_acceptance.py write schema-restart.json
          docker restart "${{ job.services.postgres.id }}"
          for attempt in $(seq 1 30); do
            docker exec "${{ job.services.postgres.id }}" pg_isready -U meridian -d meridian && break
            sleep 1
          done
          "$RUNNER_TEMP/evidence-wheel/bin/python" scripts/schema_restart_acceptance.py read schema-restart.json
      - run: uv run python scripts/record_conformance.py --junit postgresql-tests.xml --output postgresql-project-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-coverage-${{ matrix.engine }}
          path: |
            coverage.xml
            postgresql-tests.xml
            wheel-integration.xml
            projection-tests.xml
            postgresql-provenance.json
            postgresql-project-provenance.json
            schema-restart.json
            read-compatibility-receipt.json

  cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pg16-postgis34
            version: 16-postgis-3.4
            image: postgis/postgis@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
          - engine: pg17-postgis35
            version: 17.11-postgis-3.5.7
            image: postgis/postgis@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    env:
      MERIDIAN_POSTGRESQL_IMAGE: ${{ matrix.image }}
      MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv pip check --python .venv/bin/python
      - run: uv build
      - name: Run all cluster contracts from installed wheel
        run: |
          uv venv "$RUNNER_TEMP/cluster-wheel"
          uv pip install --python "$RUNNER_TEMP/cluster-wheel/bin/python" -c conformance/postgresql/requirements.txt dist/*.whl 'meridian-storage-evidence>=1.0.1,<2' 'pytest>=8.3,<9'
          uv pip check --python "$RUNNER_TEMP/cluster-wheel/bin/python"
          MERIDIAN_POSTGRESQL_PYTHON="$RUNNER_TEMP/cluster-wheel/bin/python" ./scripts/run-cluster-conformance.sh --junitxml=cluster-tests.xml
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-cluster-${{ matrix.engine }}
          path: |
            cluster-tests.xml
            cluster-integration.xml
            cluster-projection-tests.xml
            cluster-provenance.json

  package:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv pip check --python .venv/bin/python
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: Verify reproducible distributions and inventory
        run: |
          uv build --out-dir "$RUNNER_TEMP/rebuilt"
          cmp dist/*.whl "$RUNNER_TEMP"/rebuilt/*.whl
          cmp dist/*.tar.gz "$RUNNER_TEMP"/rebuilt/*.tar.gz
          uv run python scripts/generate_sbom.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-storage-postgresql-dist
          path: dist/*
